        (A12 - (0.147582623144033*BT_RAW + 2378.23391135125))**2
      + 0.0108974926521344 *
        (A12 - (0.147582623144033*BT_RAW + 2378.23391135125))
      + 497.163950305601

  WFI_MCU_B_OFFS_MON_COLD:
