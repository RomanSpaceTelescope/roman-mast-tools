      BT_RAW: WFI_MCU_B_BOARD_T_RAW
    formula: >
      1.09815017012195e-08 *
        (A8 - (0.141866523707574*BT_RAW + 2290.41722452358))**2
      + 0.0108678867720667 *
        (A8 - (0.141866523707574*BT_RAW + 2290.41722452358))
      + 495.576854941062

  # ---------------------------------------------------------------
  # OFFS monitor (channels 12-15)
  # NOTE: MCU_B channel 12 (COLDEST) coefficients were not explicitly
  # present in the extracts I inspected; the values below were taken
  # from the closest MCU-B analogue.  Verify against the full equations
  # file if precision matters.
