# =====================================================================
# Derived mnemonics
# ---------------------------------------------------------------------
# Each entry specifies how a "virtual" mnemonic is computed from one
# or more raw MAST channels.  Formulas use pandas/numpy expressions
# where the variables refer to the `inputs:` keys.
#
# Board T raw is needed for the RAWC correction of most sensors.
# =====================================================================
derived:

  # ---------------------------------------------------------------
  # MCU-B board / support temperatures (needed by many others; first)
  # ---------------------------------------------------------------
  WFI_MCU_B_BOARD_T:
    units: deg C
    inputs:
      A25: WFI_MCU_B_ANALOG_25
    # Constants: GAIN2_CAL=1.99692, GAIN4_CAL=3.98769 (from equations file)
    formula: "((((-3.78965180500010e-05 * A25) + 1.59274182543759e-04) * 1.99692 / 3.98769) * 1000.0) - 273.15"

  WFI_MCU_B_BOARD_T_RAW:
    # Raw counts of the board thermistor channel — used as an argument
    # in the RAWC corrections of the other MCU_B sensors.
    units: counts
    inputs:
      A25: WFI_MCU_B_ANALOG_25
    formula: "A25"

  WFI_MCU_B_U7_CASE_T:
    units: deg C
    inputs:
      A26: WFI_MCU_B_ANALOG_26
    formula: "((((-3.78965180500010e-05 * A26) + 1.59274182543759e-04) * 1.99692 / 3.98769) * 1000.0) - 273.15"

  WFI_MCU_B_FPGA_CASE_T:
    units: deg C
    inputs:
      A27: WFI_MCU_B_ANALOG_27
    formula: "((((-3.78965180500010e-05 * A27) + 1.59274182543759e-04) * 1.99692 / 3.98769) * 1000.0) - 273.15"

  # ---------------------------------------------------------------
  # MPA control sensor (channel 1)
  # ---------------------------------------------------------------
  WFI_MCU_B_MPA_T_CTRLSENS:
    units: K
    depends_on: [WFI_MCU_B_BOARD_T_RAW]
    inputs:
      A1: WFI_MCU_B_ANALOG_1
      BT_RAW: WFI_MCU_B_BOARD_T_RAW
    formula: >
      6.41857391845582e-10 *
        (4*A1 - (-0.0425613392114692*BT_RAW + -707.913328147364))**2
      + 0.0029979598180664 *
        (4*A1 - (-0.0425613392114692*BT_RAW + -707.913328147364))
      + 1921.4436501897

  # ---------------------------------------------------------------
  # SCEA control sensor (channel 2)
  # ---------------------------------------------------------------
  WFI_MCU_B_SCEA_T_CTRLSENS:
    units: K
    depends_on: [WFI_MCU_B_BOARD_T_RAW]
    inputs:
      A2: WFI_MCU_B_ANALOG_2
      BT_RAW: WFI_MCU_B_BOARD_T_RAW
    formula: >
      2.13315623243882e-09 *
        (A2 - (-0.0128045349611677*BT_RAW + -202.013683375665))**2
      + 0.00500165709400535 *
        (A2 - (-0.0128045349611677*BT_RAW + -202.013683375665))
      + 752.992610435348

  # ---------------------------------------------------------------
  # OFFS (Offset / CPR) control sensor (channel 3)
  # ---------------------------------------------------------------
  WFI_MCU_B_OFFS_T_CTRLSENS:
    units: K
    depends_on: [WFI_MCU_B_BOARD_T_RAW]
    inputs:
      A3: WFI_MCU_B_ANALOG_3
      BT_RAW: WFI_MCU_B_BOARD_T_RAW
    formula: >
      8.35571760906265e-09 *
        (A3 - (-0.0239806634915274*BT_RAW + -386.892093222091))**2
      + 0.0110613586627784 *
        (A3 - (-0.0239806634915274*BT_RAW + -386.892093222091))
      + 2220.54665679542

  # ---------------------------------------------------------------
  # MPA monitor (channels 4-7)
  # ---------------------------------------------------------------
  WFI_MCU_B_MPA_MON_COLDEST:
    units: K
    depends_on: [WFI_MCU_B_BOARD_T_RAW]
    inputs:
      A4: WFI_MCU_B_ANALOG_4
      BT_RAW: WFI_MCU_B_BOARD_T_RAW
    formula: >
      1.12910444303998e-08 *
        (A4 - (0.159130641617435*BT_RAW + 2566.97786965457))**2
      + 0.0108621655844855 *
        (A4 - (0.159130641617435*BT_RAW + 2566.97786965457))
      + 496.001679486628

  WFI_MCU_B_MPA_MON_COLD:
    units: K
    depends_on: [WFI_MCU_B_BOARD_T_RAW]
    inputs:
      A5: WFI_MCU_B_ANALOG_5
      BT_RAW: WFI_MCU_B_BOARD_T_RAW
    formula: >
      3.16481446326687e-09 *
        (A5 - (0.305043014574195*BT_RAW + 4919.81285200111))**2
      + 0.00594788978985127 *
        (A5 - (0.305043014574195*BT_RAW + 4919.81285200111))
      + 994.75731186642

  WFI_MCU_B_MPA_MON_MID:
    units: K
    depends_on: [WFI_MCU_B_BOARD_T_RAW]
    inputs:
      A6: WFI_MCU_B_ANALOG_6
      BT_RAW: WFI_MCU_B_BOARD_T_RAW
    formula: >
      1.44864488045953e-08 *
        (A6 - (0.147635306436666*BT_RAW + 2382.09055251355))**2
      + 0.0130212825782102 *
        (A6 - (0.147635306436666*BT_RAW + 2382.09055251355))
      + 1509.01808348352

  WFI_MCU_B_MPA_MON_WARM:
    units: K
    depends_on: [WFI_MCU_B_BOARD_T_RAW]
    inputs:
      A7: WFI_MCU_B_ANALOG_7
      BT_RAW: WFI_MCU_B_BOARD_T_RAW
    formula: >
      3.21396206149109e-08 *
        (A7 - (0.147317761313605*BT_RAW + 2379.53384948017))**2
      + 0.0146939753155724 *
        (A7 - (0.147317761313605*BT_RAW + 2379.53384948017))
      + 2111.78018221429

  # ---------------------------------------------------------------
  # SCEA monitor (channel 8; equations file shows only COLDEST for B)
  # ---------------------------------------------------------------
  WFI_MCU_B_SCEA_MON_COLDEST:
    units: K
    depends_on: [WFI_MCU_B_BOARD_T_RAW]
    inputs:
